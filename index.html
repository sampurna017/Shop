<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAV -->
<div class="nav">
  <h2>MyShop</h2>
  <input placeholder="Search..." onkeyup="search(this.value)">
  <button onclick="toggleCart()">🛒 <span id="count">0</span></button>
</div>

<!-- BANNER -->
<div class="banner">
  <h1>Big Sale 🎉</h1>
  <p>Up to 50% OFF</p>
</div>

<div class="main">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>Categories</h3>
    <p onclick="filter('all')">All</p>
    <p onclick="filter('clothes')">Clothes</p>
    <p onclick="filter('tech')">Electronics</p>
  </div>

  <!-- PRODUCTS -->
  <div class="products" id="products"></div>

</div>

<!-- CART -->
<div class="cart" id="cart">
  <h3>Your Cart</h3>
  <div id="items"></div>
  <h4>Total: Rs <span id="total">0</span></h4>
  <button onclick="purchase()">Purchase</button>
</div>

<script src="script.js"></script>
</body>
</html>
