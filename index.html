<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOP NAV -->
<div class="top">
  <h2>MyShop</h2>
  <input placeholder="Search..." onkeyup="search(this.value)">
  <button onclick="toggleCart()">🛒 (<span id="count">0</span>)</button>
</div>

<!-- MAIN LAYOUT -->
<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>Categories</h3>
    <p onclick="filter('all')">All</p>
    <p onclick="filter('clothes')">Clothes</p>
    <p onclick="filter('tech')">Electronics</p>
    <p onclick="filter('home')">Home</p>
  </div>

  <!-- PRODUCTS -->
  <div class="products" id="products"></div>

</div>

<!-- CART -->
<div class="cart" id="cart">
  <h3>Your Cart</h3>
  <div id="items"></div>
  <h4>Total: Rs <span id="total">0</span></h4>
</div>

<script src="script.js"></script>
</body>
</html>
