<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOP BAR -->
<div class="top">
  <h2>MyShop</h2>
  <input placeholder="Search..." onkeyup="search(this.value)">
  <button onclick="toggleCart()">🛒 (<span id="count">0</span>)</button>
</div>

<!-- CATEGORY -->
<div class="cat">
  <span onclick="filter('all')">All</span>
  <span onclick="filter('clothes')">Clothes</span>
  <span onclick="filter('tech')">Electronics</span>
</div>

<!-- BANNER -->
<div class="banner">🔥 Flash Sale - Big Discounts!</div>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<!-- CART -->
<div class="cart" id="cart">
  <h3>Cart</h3>
  <div id="items"></div>
  <h4>Total: Rs <span id="total">0</span></h4>
</div>

<script src="script.js"></script>
</body>
</html>
